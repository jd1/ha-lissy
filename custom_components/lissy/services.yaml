renew:
  name: Renew loans
  description: >
    Target a book sensor to renew that item, or the Lissy device to renew all loans for that account.
  target:
    entity:
      - domain: sensor
        integration: lissy
  fields:
    device_id:
      name: Device
      description: >
        The Lissy account device to renew all loans for.
        Leave empty if targeting a book sensor instead.
      required: false
      selector:
        device:
          integration: lissy
