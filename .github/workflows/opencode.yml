name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for opencode"
        required: true
      agent:
        description: "Agent to use (build or plan)"
        required: false
        default: "build"

jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: opencode[bot]
          GIT_AUTHOR_EMAIL: opencode[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode[bot]
          GIT_COMMITTER_EMAIL: opencode[bot]@users.noreply.github.com
        with:
          model: opencode-go/glm-5.2
          prompt: ${{ github.event.inputs.prompt }}
          agent: ${{ github.event.inputs.agent }}
          use_github_token: true
        timeout-minutes: 30
